<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ABP zoom click test</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #fff; }
  /* A small target at a fixed CSS position. Small enough that a ~20% zoom
     offset misses it, large enough to not be flaky. Center = (310, 310) CSS. */
  #t {
    position: absolute;
    left: 290px; top: 290px; width: 40px; height: 40px;
    background: #00aa00;
  }
</style>
</head>
<body>
  <div id="t"></div>
  <script>
    // Record the CSS coordinates (clientX/clientY) and target of any click,
    // so the test can verify where an ABP click actually landed.
    window.__c = null;
    document.addEventListener('click', function (e) {
      window.__c = {
        x: e.clientX,
        y: e.clientY,
        id: (e.target && e.target.id) || '',
        tag: (e.target && e.target.tagName) || ''
      };
    }, true);
  </script>
</body>
</html>
